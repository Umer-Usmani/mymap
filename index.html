<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Middle East Itinerary</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
            --bg: #ecf0f1;
            --card-bg: #ffffff;
        }

        body {
            margin: 0;
            padding: 2rem;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background-color: var(--primary);
            color: white;
            padding: 1.5rem 2rem;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .content {
            display: flex;
            flex-direction: column;
            padding: 2rem;
            gap: 2rem;
        }

        @media (min-width: 850px) {
            .content {
                flex-direction: row;
            }
        }

        .itinerary-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* Custom scrollbar */
        .itinerary-list::-webkit-scrollbar {
            width: 6px;
        }

        .itinerary-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .itinerary-list::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        .itinerary-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem;
            border-radius: 8px;
            transition: all 0.2s ease;
            background-color: #fcfcfc;
            border: 1px solid #f0f0f0;
            cursor: pointer;
        }

        .itinerary-item:hover {
            background-color: #f8f9fa;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }

        .step-number {
            background-color: var(--accent);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.9rem;
            flex-shrink: 0;
            box-shadow: 0 4px 6px rgba(231, 76, 60, 0.3);
        }

        .step-thumbnail {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .step-name {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .map-container {
            flex: 1.5;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 2px solid #f0f0f0;
        }

        #map {
            height: 500px;
            width: 100%;
            z-index: 1;
        }

        /* Custom Popup Styling */
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
            padding: 0;
            overflow: hidden;
        }

        .leaflet-popup-content {
            margin: 0;
            width: 200px !important;
        }

        .popup-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
            display: block;
        }

        .popup-title {
            padding: 10px;
            margin: 0;
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            color: var(--primary);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>Desert Journey Itinerary</h1>
        </div>
        <div class="content">
            <div class="itinerary-list" id="itinerary-list">
                <!-- Items will be injected by JS -->
            </div>

            <div class="map-container">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>||

    <script>
        // Define the locations with images
        var locations = [
            {
                name: "Dubai",
                coords: [25.2048, 55.2708],
                image: "./dubai.jpg"
            },
            {
                name: "Jeddah",
                coords: [21.4858, 39.1925],
                image: "./jeddah.jpg"
            },
            {
                name: "Amman",
                coords: [31.9454, 35.9284],
                image: "./amman.jpg"
            },
            {
                name: "Petra",
                coords: [30.3285, 35.4444],
                image: "./petra.jpg"
            },
            {
                name: "Wadi Rum",
                coords: [29.5385, 35.4194],
                image: "./wadi_rum.jpg"
            },
            {
                name: "Return to Dubai",
                coords: [25.2048, 55.2708],
                image: "./dubai.jpg"
            }
        ];

        var map = L.map('map', {
            center: [26.0, 45.0],
            zoom: 5
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        var listContainer = document.getElementById('itinerary-list');
        var routeCoords = [];
        var markers = [];

        locations.forEach(function (loc, index) {
            // Populate sidebar list with thumbnails
            var itemHtml = `
                <div class="itinerary-item" onclick="focusOnLocation(${index})">
                    <div class="step-number">${index + 1}</div>
                    <img src="${loc.image}" class="step-thumbnail" alt="${loc.name}">
                    <div class="step-name">${loc.name}</div>
                </div>
            `;
            listContainer.insertAdjacentHTML('beforeend', itemHtml);

            // Slightly offset the final return marker so it can be distinguished from the starting point
            var markerCoords = [...loc.coords];
            if (index === locations.length - 1) {
                markerCoords[0] -= 0.02; // Small offset south
                markerCoords[1] += 0.02; // Small offset east
            }

            var marker = L.marker(markerCoords).addTo(map);

            // Rich popup content with image
            var popupContent = `
                <img src="${loc.image}" class="popup-image" alt="${loc.name}">
                <p class="popup-title">${index + 1}. ${loc.name}</p>
            `;
            marker.bindPopup(popupContent);

            markers.push(marker);
            routeCoords.push(loc.coords); // The path continues to the actual exact coordinates
        });

        // Draw the itinerary line connecting the points
        var itineraryPath = L.polyline(routeCoords, {
            color: '#e74c3c',
            weight: 4,
            opacity: 0.8,
            dashArray: '8, 8'
        }).addTo(map);

        map.fitBounds(itineraryPath.getBounds(), { padding: [30, 30] });

        // Make list items interactive
        window.focusOnLocation = function (index) {
            var marker = markers[index];
            map.setView(marker.getLatLng(), 8, { animate: true }); // Zoom in nicely
            marker.openPopup();
        };

    </script>
</body>

</html>
