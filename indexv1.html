<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Middle East Itinerary</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b0c10;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.1);
            --accent-1: #f9a826;
            --accent-2: #ff4b2b;
            --text-main: #ffffff;
            --text-muted: #a0aab2;
        }
        
        body {
            margin: 0;
            padding: 2rem;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 75, 43, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(249, 168, 38, 0.15), transparent 25%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1200px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            overflow: hidden;
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            padding: 2rem 3rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        
        .header p {
            margin: 0.5rem 0 0 0;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .content {
            display: flex;
            flex-direction: column;
            padding: 0 2rem 2rem 2rem;
            gap: 2rem;
        }

        @media (min-width: 900px) {
            .content {
                flex-direction: row;
            }
        }

        .itinerary-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 550px;
            overflow-y: auto;
            padding-right: 15px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }

        .itinerary-list::-webkit-scrollbar {
            width: 6px;
        }
        .itinerary-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2); 
            border-radius: 10px;
        }

        .itinerary-item {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            padding: 1rem;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .itinerary-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: linear-gradient(to bottom, var(--accent-1), var(--accent-2));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .itinerary-item:hover, .itinerary-item.active {
            background: var(--surface-hover);
            transform: translateX(5px);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .itinerary-item:hover::before, .itinerary-item.active::before {
            opacity: 1;
        }

        .step-number {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 1rem;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
        }

        .step-thumbnail {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .step-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .step-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.2rem;
        }
        
        .step-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .map-container {
            flex: 2;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        #map {
            height: 550px;
            width: 100%;
            z-index: 1;
            background-color: #1a1a1a;
        }

        /* Dark Theme Leaflet Controls */
        .leaflet-control-zoom a {
            background-color: rgba(25, 25, 30, 0.9) !important;
            color: white !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            backdrop-filter: blur(10px);
        }
        .leaflet-control-zoom a:hover {
            background-color: rgba(40, 40, 50, 0.9) !important;
        }

        /* Beautiful Custom Popup */
        .leaflet-popup-content-wrapper {
            background: rgba(20, 20, 25, 0.85) !important;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5) !important;
            color: white;
        }
        .leaflet-popup-tip {
            background: rgba(20, 20, 25, 0.85) !important;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .leaflet-popup-content {
            margin: 0;
            width: 220px !important;
        }
        .popup-image {
            width: 100%;
            height: 140px;
            object-fit: cover;
            display: block;
        }
        .popup-details {
            padding: 15px;
            text-align: center;
        }
        .popup-title {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-main);
        }
        .leaflet-popup-close-button {
            color: white !important;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            font-weight: bold;
        }

        /* Glowing Path Animation */
        .glowing-path {
            animation: dash 30s linear infinite;
        }
        @keyframes dash {
            to {
                stroke-dashoffset: -1000;
            }
        }
        
        /* Custom Marker CSS */
        .custom-glow-marker {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            border-radius: 50%;
            box-shadow: 0 0 15px var(--accent-2), inset 0 0 5px rgba(255,255,255,0.8);
            border: 2px solid white;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <div>
                <h1>Desert Journey</h1>
                <p>An epic adventure across the Middle East</p>
            </div>
        </div>
        <div class="content">
            <div class="itinerary-list" id="itinerary-list">
                <!-- Items will be injected by JS -->
            </div>
            
            <div class="map-container">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>
        // Define the locations
        var locations = [
            { 
                name: "Dubai", 
                desc: "The city of the future",
                coords: [25.2048, 55.2708],
                image: "./dubai.jpg"
            },
            { 
                name: "Jeddah", 
                desc: "Gateway to the Red Sea",
                coords: [21.4858, 39.1925],
                image: "./jeddah.jpg"
            },
            { 
                name: "Amman", 
                desc: "Ancient and modern vibes",
                coords: [31.9454, 35.9284],
                image: "./amman.jpg"
            },
            { 
                name: "Petra", 
                desc: "The Rose City",
                coords: [30.3285, 35.4444],
                image: "./petra.jpg"
            },
            { 
                name: "Wadi Rum", 
                desc: "The Valley of the Moon",
                coords: [29.5385, 35.4194],
                image: "./wadi_rum.jpg"
            },
            { 
                name: "Return to Dubai", 
                desc: "Journey's end",
                coords: [25.2048, 55.2708],
                image: "./dubai.jpg"
            }
        ];

        var map = L.map('map', {
            center: [26.0, 45.0],
            zoom: 5,
            zoomControl: false // Move to bottom right
        });
        
        L.control.zoom({
            position: 'bottomright'
        }).addTo(map);

        // Dark modern map tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; CartoDB'
        }).addTo(map);

        var listContainer = document.getElementById('itinerary-list');
        var routeCoords = [];
        var markers = [];
        var listItems = [];

        locations.forEach(function(loc, index) {
            // Create list item
            var itemDiv = document.createElement('div');
            itemDiv.className = 'itinerary-item';
            itemDiv.onclick = function() { focusOnLocation(index); };
            itemDiv.innerHTML = `
                <div class="step-number">${index + 1}</div>
                <img src="${loc.image}" class="step-thumbnail" alt="${loc.name}">
                <div class="step-details">
                    <div class="step-name">${loc.name}</div>
                    <div class="step-desc">${loc.desc}</div>
                </div>
            `;
            listContainer.appendChild(itemDiv);
            listItems.push(itemDiv);

            // Slightly offset the final return marker
            var markerCoords = [...loc.coords];
            if (index === locations.length - 1) {
                markerCoords[0] -= 0.05; 
                markerCoords[1] += 0.05;
            }
            
            // Custom glowing marker icon
            var customIcon = L.divIcon({
                className: 'custom-glow-marker',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });

            var marker = L.marker(markerCoords, {icon: customIcon}).addTo(map);
            
            // Rich popup content
            var popupContent = `
                <img src="${loc.image}" class="popup-image" alt="${loc.name}">
                <div class="popup-details">
                    <p class="popup-title">${index + 1}. ${loc.name}</p>
                </div>
            `;
            marker.bindPopup(popupContent);
            
            markers.push(marker);
            routeCoords.push(loc.coords);
        });

        // Draw animated glowing itinerary line
        var itineraryPath = L.polyline(routeCoords, {
            color: '#ff4b2b',
            weight: 3,
            opacity: 0.9,
            dashArray: '10, 15',
            className: 'glowing-path'
        }).addTo(map);

        map.fitBounds(itineraryPath.getBounds(), { padding: [50, 50] });

        window.focusOnLocation = function(index) {
            // Update active state in list
            listItems.forEach(item => item.classList.remove('active'));
            listItems[index].classList.add('active');
            
            // Pan and show popup
            var marker = markers[index];
            map.setView(marker.getLatLng(), 8, { animate: true, duration: 1 });
            setTimeout(() => {
                marker.openPopup();
            }, 300); // slight delay for smooth visual flow
        };

    </script>
</body>
</html>
